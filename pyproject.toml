[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kub-mitigation-agent"
version = "0.1.0"
description = "Kubernetes mitigation agent for chaos engineering and automated remediation"
requires-python = ">=3.8"
dependencies = [
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-xai",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "locust",
    "gevent",
    "kubernetes",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kub_mitigation_agent*"]
exclude = ["tests*", "scripts*", "mcp*", "DATASET_LOGS*"]

