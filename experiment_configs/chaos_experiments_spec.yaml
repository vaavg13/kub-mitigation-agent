# Chaos Experiments Specification
# This file defines which chaos experiments to run, with explicit counts for each type.
# Used by all application batch configurations.

chaos_experiments:
  pod_level:
    cpu_stress:
      extreme:
        one_pod: 0
        all_pods_app: 0
        all_pods_node: 0
    memory_stress:
      extreme:
        one_pod: 0
        all_pods_app: 0
        all_pods_node: 0
    pod_failure:
      extreme:
        one_pod: 1
        all_pods_app: 0
        all_pods_node: 0
  
  no_failure: 0

