# Chaos Experiments Specification
# This file defines which chaos experiments to run, with explicit counts for each type.
# Used by all application batch configurations.

chaos_experiments:
  pod_level:
    cpu_stress:
      extreme:
        one_pod: 0
        all_pods_app: 0
        all_pods_node: 0
    memory_stress:
      extreme:
        one_pod: 0
        all_pods_app: 0
        all_pods_node: 0
    pod_failure:
      extreme:
        one_pod: 0
        all_pods_app: 0
        all_pods_node: 0
  
  node_level:
    node_stress: 1
  
  # traffic_spike:
  #   extreme: 2
  #   medium: 2
  #   mild: 2
  
  no_failure: 0

