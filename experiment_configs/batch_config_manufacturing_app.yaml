BATCH_CONFIG:
  namespace: "app-smart-manufacturing"
  app_directory: "./APPS"

  warmup_duration: 60
  baseline_duration: 60
  chaos_warmup_duration: 60
  recovery_duration: 60

  batch_settings:
    random_seed: 42
    delay_between_experiments: 0
    chaos_experiments_file: "./experiment_configs/chaos_experiments_spec.yaml"

  available_deployments:
    - "sensor-data-ingestion-edge-site-1"
    - "sensor-data-ingestion-edge-site-2"
    - "edge-data-preprocessing-edge-site-1"
    - "edge-data-preprocessing-edge-site-2"
    - "real-time-anomaly-detection-edge-site-1"
    - "real-time-anomaly-detection-edge-site-2"
    - "local-control-actuation-edge-site-1"
    - "local-control-actuation-edge-site-2"
    - "predictive-maintenance-analytics-cloud"
    - "production-optimization-engine-cloud"
    - "inventory-supply-chain-mgmt-cloud"
    - "centralized-data-lake-cloud"
    - "reporting-dashboarding-cloud"

  traffic_config:
    host: "http://172.23.0.5:30435"
    endpoints:
      - "/sensor-data-ingestion-edge-site-1"
      - "/sensor-data-ingestion-edge-site-2"
    num_users: 5
    spawn_rate: 1
    wait_time_min: 1
    wait_time_max: 3
    request_timeout: 10

  test_settings:
    deploy_fresh_app: true
    cleanup_after_test: true
    pod_ready_timeout: 300

  chaosd:
    port: 31767

  nodes:
    cloud-worker-1: "192.168.121.163"
    cloud-worker-2: "192.168.121.242"
    edge-worker-1: "192.168.121.9"
    edge-worker-2: "192.168.121.66"
    edge-worker-3: "192.168.121.22"
    edge-worker-4: "192.168.121.12"


