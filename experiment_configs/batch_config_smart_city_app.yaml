BATCH_CONFIG:
  namespace: "app-smart-city"
  app_directory: "./APPS"

  warmup_duration: 60
  baseline_duration: 60
  chaos_warmup_duration: 60
  recovery_duration: 60

  batch_settings:
    random_seed: 420
    delay_between_experiments: 0

  available_deployments:
    - "traffic-sensor-ingest-edge-site-1"
    - "traffic-sensor-ingest-edge-site-2"
    - "edge-traffic-analytics-edge-site-1"
    - "edge-traffic-analytics-edge-site-2"
    - "signal-control-logic-edge-site-1"
    - "signal-control-logic-edge-site-2"
    - "incident-detection-edge-edge-site-1"
    - "incident-detection-edge-edge-site-2"
    - "vehicle-to-infrastructure-edge-site-1"
    - "vehicle-to-infrastructure-edge-site-2"
    - "cloud-data-ingestion-cloud"
    - "central-traffic-optimization-cloud"
    - "route-guidance-system-cloud"
    - "emergency-mgmt-dispatch-cloud"
    - "public-facing-apps-backend-cloud"
    - "historical-traffic-data-store-cloud"
    - "reporting-planning-tools-cloud"

  traffic_config:
    host: "http://192.168.100.10:31596"
    endpoints:
      - "/traffic-sensor-ingest-edge-site-1"
      - "/traffic-sensor-ingest-edge-site-2"
    num_users: 5
    spawn_rate: 1
    wait_time_min: 1
    wait_time_max: 3
    request_timeout: 10

  test_settings:
    deploy_fresh_app: true
    cleanup_after_test: true
    pod_ready_timeout: 300

  chaosd:
    port: 31767

  nodes:
    cloud-worker-1: "192.168.100.21"
    cloud-worker-2: "192.168.100.22"
    edge-site-1-worker-1: "192.168.100.23"
    edge-site-1-worker-2: "192.168.100.24"
    edge-site-2-worker-1: "192.168.100.25"
    edge-site-2-worker-2: "192.168.100.26"

  chaos_experiments:
    baseline:
      - name: "baseline-1"
      - name: "baseline-2"
      - name: "baseline-3"

    pod_level:
      cpu_stress:
        - name: "cpu-one-traffic-ingest-1"
          app: "traffic-sensor-ingest-edge-site-1"
          target_mode: "one_pod"
          workers: 2
          load: 82
        - name: "cpu-one-edge-analytics-1"
          app: "edge-traffic-analytics-edge-site-1"
          target_mode: "one_pod"
          workers: 3
          load: 88
        - name: "cpu-all-traffic-ingest-2"
          app: "traffic-sensor-ingest-edge-site-2"
          target_mode: "all_pods_app"
          workers: 2
          load: 85
        - name: "cpu-all-cloud-optimization"
          app: "central-traffic-optimization-cloud"
          target_mode: "all_pods_app"
          workers: 4
          load: 95

      memory_stress:
        - name: "memory-one-traffic-ingest-1"
          app: "traffic-sensor-ingest-edge-site-1"
          target_mode: "one_pod"
          size: "1GB"
          workers: 1
        - name: "memory-one-signal-control-1"
          app: "signal-control-logic-edge-site-1"
          target_mode: "one_pod"
          size: "2GB"
          workers: 2
        - name: "memory-all-traffic-ingest-2"
          app: "traffic-sensor-ingest-edge-site-2"
          target_mode: "all_pods_app"
          size: "1.5GB"
          workers: 2
        - name: "memory-all-cloud-optimization"
          app: "central-traffic-optimization-cloud"
          target_mode: "all_pods_app"
          size: "2.5GB"
          workers: 3

      pod_failure:
        - name: "podfailure-one-traffic-ingest-1"
          app: "traffic-sensor-ingest-edge-site-1"
          target_mode: "one_pod"
        - name: "podfailure-one-edge-analytics-1"
          app: "edge-traffic-analytics-edge-site-1"
          target_mode: "one_pod"
        - name: "podfailure-all-traffic-ingest-2"
          app: "traffic-sensor-ingest-edge-site-2"
          target_mode: "all_pods_app"
        - name: "podfailure-all-public-backend"
          app: "public-facing-apps-backend-cloud"
          target_mode: "all_pods_app"

    node_level:
      node_cpu_stress:
        - name: "node-cpu-cloud-primary"
          node: "cloud-worker-1"
          load: 90
          workers: 6
        - name: "node-cpu-edge-center"
          node: "edge-site-1-worker-1"
          load: 88
          workers: 5
        - name: "node-cpu-edge-outskirt"
          node: "edge-site-2-worker-1"
          load: 90
          workers: 5
      node_memory_stress:
        - name: "node-mem-cloud-reserve"
          node: "cloud-worker-2"
          size: "3GB"
          workers: 1
        - name: "node-mem-edge-center"
          node: "edge-site-1-worker-2"
          size: "3GB"
          workers: 1
        - name: "node-mem-edge-outskirt"
          node: "edge-site-2-worker-2"
          size: "3GB"
          workers: 1


