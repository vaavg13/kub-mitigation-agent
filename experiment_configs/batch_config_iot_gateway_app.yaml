BATCH_CONFIG:
  namespace: "app-iot-gateway"
  app_directory: "./APPS"

  warmup_duration: 60
  baseline_duration: 60
  chaos_warmup_duration: 60
  recovery_duration: 60

  batch_settings:
    random_seed: 42
    delay_between_experiments: 0
    chaos_experiments_file: "./experiment_configs/chaos_experiments_spec.yaml"

  node_resources:
    k3d-cec-emulator-agent-0: { cpus: "4", memory: "4g" }
    k3d-cec-emulator-agent-1: { cpus: "4", memory: "4g" }
    k3d-cec-emulator-agent-2: { cpus: "2", memory: "2g" }
    k3d-cec-emulator-agent-3: { cpus: "2", memory: "2g" }
    k3d-cec-emulator-agent-4: { cpus: "2", memory: "2g" }
    k3d-cec-emulator-agent-5: { cpus: "2", memory: "2g" }

  available_deployments:
    - "cloud-analytics-engine-cloud"
    - "edge-data-processor-edge-site-1"
    - "iot-gateway-edge-site-1"
    - "iot-gateway-edge-site-2"

  traffic_config:
    endpoints:
      - "http://172.21.0.5:30435/iot-device-gateway-edge-site-1"
      - "http://172.21.0.5:30435/iot-device-gateway-edge-site-2"
    num_users: 100
    spawn_rate: 10
    wait_time_min: 0.5
    wait_time_max: 1.5
    request_timeout: 10
    collect_metrics: true

  test_settings:
    deploy_fresh_app: true
    cleanup_after_test: true
    pod_ready_timeout: 300
