llm:
  provider: anthropic           # openai | anthropic | google | xai
  model: claude-sonnet-4-5-20250929 # gpt-4.1 | gpt-5 | claude-sonnet-4-5-20250929
  temperature: 0.2
  max_tokens: 4096
  request_timeout: 120

agent:
  max_rounds: 30
  timeout: 600               # 10 minutes total for agent execution (GPT-5 is slow)
  show_reasoning: true
  reasoning_in_context: true
  verbose: false

mcp:
  server_command: "node ./mcp/mcp-server-kubernetes/dist/index.js"