llm:
  provider: openai           # openai | anthropic | google | xai
  model: gpt-5 # gpt-4.1 | gpt-5 | claude-sonnet-4-5-20250929
  temperature: 0.2
  max_tokens: 4096
  request_timeout: 120

agent:
  max_rounds: 30
  timeout: 600
  agent_type: react          # graph | react

mcp:
  server_command: "node ./mcp/mcp-server-kubernetes/dist/index.js"