llm:
  provider: openai           # openai | anthropic | google | xai
  model: gpt-4.1
  temperature: 0.2
  max_tokens: 4096
  request_timeout: 120

agent:
  max_rounds: 30
  timeout: 180
  show_reasoning: true
  reasoning_in_context: true
  verbose: false

mcp:
  server_command: "node ./mcp/mcp-server-kubernetes/dist/index.js"