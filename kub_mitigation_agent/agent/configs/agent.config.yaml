llm:
  provider: openai           # openai | anthropic | google | xai
  model: gpt-5 # gpt-4.1 | gpt-5 | claude-sonnet-4-5-20250929
  temperature: 0.2
  max_tokens: 4096
  request_timeout: 120

agent:
  enabled: true
  max_rounds: 30
  timeout: 600
  full_output: true
  show_observations: false
  allow_parallel_tools: true

mcp:
  server_command: "npx -y mcp-server-kubernetes"
  timeout_seconds: 600  # 10 minutes - kubectl operations capped at 9 minutes