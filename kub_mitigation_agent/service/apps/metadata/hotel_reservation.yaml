# Hotel Reservation Application Metadata
# Minimal config - deployment logic in hotel_reservation.py class

name: "Hotel Reservation"
namespace: "hotel-reservation"
description: "Hotel reservation microservice from DeathStarBench"

# Deployment configuration
deployment:
  type: "kubernetes"
  manifest_dir: "kubernetes"
  
# Workload configuration
workload:
  # Traffic profile (defined in apps/profiles/hotel_reservation.py)
  profile: "hotel_reservation"
  
  # Default load parameters (can be overridden in config)
  default_users: 10
  spawn_rate: 2
  wait_time_min: 1
  wait_time_max: 3

# Key services to monitor
critical_services:
  - "frontend"
  - "search"
  - "geo"
  - "rate"
  - "profile"
  - "recommendation"
  - "user"
  - "reservation"
